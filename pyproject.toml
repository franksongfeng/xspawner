[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "xspawner"
authors = [{name = "Song Feng", email = "43217183@qq.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dynamic = ["version", "description"]
# Python 3.8 是 Ubuntu 20.04 的默认版本；部分依赖的新版本已不再支持 3.8，
# 因此用环境标记固定 3.8 上可用的最后一批版本。
dependencies = [
    "requests>=2.22.0",
    "tornado>=6.4.1,<6.5; python_version < '3.9'",
    "tornado>=6.4.1; python_version >= '3.9'",
    "pywebio<=1.8.3",
    "pycurl==7.45.3; python_version < '3.9'",
    "pycurl>=7.45.7; python_version >= '3.9'",
    "ipaddress>=1.0.23",
    "psutil>=5.9.5",
    "bokeh>=3.1.1,<3.2; python_version < '3.9'",
    "bokeh>=3.1.1; python_version >= '3.9'",
    "tortoise-orm>=0.23.0,<0.24; python_version < '3.9'",
    "tortoise-orm>=0.23.0; python_version >= '3.9'",
    "aiomysql>=0.2.0",
    "asyncpg>=0.30.0,<0.31; python_version < '3.9'",
    "asyncpg>=0.30.0; python_version >= '3.9'",
    "pyinstaller>=6.22.3"
]

[project.urls]
Home = "https://github.com/franksongfeng/xspawner"

[tool.setuptools]
# packages = {find = {where = ["xspawner"]}}
packages = [
    "xspawner",
    "xspawner.plugins",
    "xspawner.plugins.administrator"
]

[tool.setuptools.package-data]
xspawner = [
    "static/*"
]