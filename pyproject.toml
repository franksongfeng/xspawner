[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "xspawner"
authors = [{name = "Song Feng", email = "43217183@qq.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
dynamic = ["version", "description"]
dependencies = [
    "requests>=2.22.0",
    "tornado>=6.4.1",
    "pywebio>=1.8.3",
    "psutil>=5.9.5",
    "bokeh>=3.1.1",
    "tortoise-orm>=0.23.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.30.0",    
    "pyinstaller>=6.22.3"
]

[project.urls]
Home = "https://github.com/franksongfeng/xspawner"

[tool.setuptools]
# packages = {find = {where = ["xspawner"]}}
packages = [
    "xspawner",
    "xspawner.plugins",
    "xspawner.utilities"
]

[tool.setuptools.package-data]
xspawner = [
    "static/*"
]